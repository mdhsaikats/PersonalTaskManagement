<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>TaskMinder Tasks</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>

  <body class="bg-gray-50">
    <div class="flex min-h-screen">
      <!-- Sidebar -->
      <aside class="w-[240px] bg-white border-r border-gray-200 flex flex-col fixed h-full z-10">
        <!-- Logo -->
        <div class="flex items-center gap-3 px-5 py-6">
          <div class="flex h-12 w-12 items-center justify-center">
            <img src="../asset/logo.png" alt="TaskMinder logo" class="h-12 w-12 object-contain" />
          </div>
          <div>
            <h1 class="text-base font-bold text-gray-900 leading-tight">TaskMinder</h1>
            <p class="text-xs text-gray-400">Productivity App</p>
          </div>
        </div>

        <!-- Navigation -->
        <nav class="flex-1 flex flex-col gap-1 px-3 mt-2">
          <a
            href="dashboard.html"
            class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100 transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-500 focus-visible:outline-offset-2"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
            </svg>
            Dashboard
          </a>

          <a
            href="projects.html"
            class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100 transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-500 focus-visible:outline-offset-2"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
            </svg>
            Projects
          </a>

          <a
            href="tasks.html"
            class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-semibold text-white bg-blue-600 shadow-sm transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-500 focus-visible:outline-offset-2"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
            </svg>
            Tasks
          </a>

          <a
            href="calendar.html"
            class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100 transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-500 focus-visible:outline-offset-2"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
            Calendar
          </a>

          <a
            href="setting.html"
            class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100 transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-500 focus-visible:outline-offset-2"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            Settings
          </a>
        </nav>

        <!-- Logout -->
        <div class="px-4 py-4 border-t border-gray-200">
          <button
            class="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg bg-red-50 text-red-600 border border-red-100 hover:bg-red-100 transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-red-500 focus-visible:outline-offset-2"
            onclick="localStorage.removeItem('token'); window.location.href='index.html';"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 21h8a2 2 0 002-2v-2" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M13 5V3a2 2 0 00-2-2H3a2 2 0 00-2 2v16a2 2 0 002 2h8a2 2 0 002-2v-2" />
            </svg>
            Logout
          </button>
        </div>
      </aside>

      <!-- Main Area -->
      <div class="flex-1 flex flex-col ml-[240px]">
        <!-- Top Header -->
        <header class="flex items-center justify-between bg-white px-8 py-4 border-b border-gray-200 sticky top-0 z-[5]">
          <div class="flex items-center gap-3">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
            </svg>
            <h1 class="text-xl font-bold text-gray-900">Tasks</h1>
          </div>
          <button
            id="openNewTaskModal"
            class="inline-flex items-center gap-2 px-4 py-2.5 rounded-lg bg-blue-600 text-white text-sm font-semibold hover:bg-blue-700 transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-500 focus-visible:outline-offset-2"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
            </svg>
            New Task
          </button>
        </header>

        <!-- Main Content: Kanban Board -->
        <main class="p-8 flex-1 overflow-auto">
          <div id="tasks_skeleton" class="grid grid-cols-3 gap-6">
            <div class="flex flex-col">
              <div class="flex items-center gap-2 mb-4 px-1">
                <div class="w-5 h-5 rounded-full bg-gray-200 animate-pulse"></div>
                <div class="h-4 w-20 bg-gray-200 rounded-md animate-pulse"></div>
              </div>
              <div class="bg-gray-100/70 rounded-2xl p-3 flex flex-col gap-3 flex-1">
                <div class="bg-white rounded-xl p-4 border border-gray-100">
                  <div class="h-3 w-24 bg-gray-200 rounded-md animate-pulse mb-3"></div>
                  <div class="h-4 w-32 bg-gray-200 rounded-md animate-pulse mb-2"></div>
                  <div class="h-3 w-full bg-gray-100 rounded-md animate-pulse"></div>
                </div>
                <div class="bg-white rounded-xl p-4 border border-gray-100">
                  <div class="h-3 w-24 bg-gray-200 rounded-md animate-pulse mb-3"></div>
                  <div class="h-4 w-32 bg-gray-200 rounded-md animate-pulse mb-2"></div>
                  <div class="h-3 w-full bg-gray-100 rounded-md animate-pulse"></div>
                </div>
              </div>
            </div>
            <div class="flex flex-col">
              <div class="flex items-center gap-2 mb-4 px-1">
                <div class="w-5 h-5 rounded-full bg-gray-200 animate-pulse"></div>
                <div class="h-4 w-20 bg-gray-200 rounded-md animate-pulse"></div>
              </div>
              <div class="bg-gray-100/70 rounded-2xl p-3 flex flex-col gap-3 flex-1">
                <div class="bg-white rounded-xl p-4 border border-gray-100">
                  <div class="h-3 w-24 bg-gray-200 rounded-md animate-pulse mb-3"></div>
                  <div class="h-4 w-32 bg-gray-200 rounded-md animate-pulse mb-2"></div>
                  <div class="h-3 w-full bg-gray-100 rounded-md animate-pulse"></div>
                </div>
                <div class="bg-white rounded-xl p-4 border border-gray-100">
                  <div class="h-3 w-24 bg-gray-200 rounded-md animate-pulse mb-3"></div>
                  <div class="h-4 w-32 bg-gray-200 rounded-md animate-pulse mb-2"></div>
                  <div class="h-3 w-full bg-gray-100 rounded-md animate-pulse"></div>
                </div>
              </div>
            </div>
            <div class="flex flex-col">
              <div class="flex items-center gap-2 mb-4 px-1">
                <div class="w-5 h-5 rounded-full bg-gray-200 animate-pulse"></div>
                <div class="h-4 w-20 bg-gray-200 rounded-md animate-pulse"></div>
              </div>
              <div class="bg-gray-100/70 rounded-2xl p-3 flex flex-col gap-3 flex-1">
                <div class="bg-white rounded-xl p-4 border border-gray-100">
                  <div class="h-3 w-24 bg-gray-200 rounded-md animate-pulse mb-3"></div>
                  <div class="h-4 w-32 bg-gray-200 rounded-md animate-pulse mb-2"></div>
                  <div class="h-3 w-full bg-gray-100 rounded-md animate-pulse"></div>
                </div>
                <div class="bg-white rounded-xl p-4 border border-gray-100">
                  <div class="h-3 w-24 bg-gray-200 rounded-md animate-pulse mb-3"></div>
                  <div class="h-4 w-32 bg-gray-200 rounded-md animate-pulse mb-2"></div>
                  <div class="h-3 w-full bg-gray-100 rounded-md animate-pulse"></div>
                </div>
              </div>
            </div>
          </div>

          <div class="grid grid-cols-3 gap-6 h-full hidden" id="tasks_board">
            <!-- Column: To Do -->
            <div class="flex flex-col">
              <div class="flex items-center gap-2 mb-4 px-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="3" width="18" height="18" rx="2" />
                </svg>
                <h3 class="text-sm font-bold text-gray-700">To do</h3>
              </div>
              <div id="todo_column" class="bg-gray-100/70 rounded-2xl p-3 flex flex-col gap-3 flex-1"></div>
            </div>

            <!-- Column: In Progress -->
            <div class="flex flex-col">
              <div class="flex items-center gap-2 mb-4 px-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <h3 class="text-sm font-bold text-gray-700">In progress</h3>
              </div>
              <div id="inprogress_column" class="bg-gray-100/70 rounded-2xl p-3 flex flex-col gap-3 flex-1"></div>
            </div>

            <!-- Column: Done -->
            <div class="flex flex-col">
              <div class="flex items-center gap-2 mb-4 px-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <h3 class="text-sm font-bold text-gray-700">Done</h3>
              </div>
              <div id="done_column" class="bg-gray-100/70 rounded-2xl p-3 flex flex-col gap-3 flex-1"></div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- New Task Modal -->
    <div id="newTaskModal" class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50 p-4" aria-hidden="true">
      <div id="newTaskModalPanel" class="w-full max-w-xl bg-white rounded-2xl shadow-xl border border-gray-200">
        <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100">
          <h3 class="text-lg font-bold text-gray-900">Create New Task</h3>
          <button id="closeNewTaskModal" class="p-2 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-lg transition-colors" aria-label="Close new task modal">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <form id="newTaskForm" class="px-6 py-5 space-y-4">
          <div>
            <label for="taskTitle" class="text-sm font-medium text-gray-700">Task Title</label>
            <input
              id="taskTitle"
              name="taskTitle"
              type="text"
              required
              placeholder="Enter task title"
              class="mt-2 w-full px-3 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>

          <div>
            <label for="taskDescription" class="text-sm font-medium text-gray-700">Description</label>
            <textarea
              id="taskDescription"
              name="taskDescription"
              rows="4"
              placeholder="Add a short task description"
              class="mt-2 w-full px-3 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"
            ></textarea>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label for="taskStatus" class="text-sm font-medium text-gray-700">Status</label>
              <select
                id="taskStatus"
                name="taskStatus"
                class="mt-2 w-full px-3 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
              >
                <option value="todo">To do</option>
                <option value="in_progress">In progress</option>
                <option value="completed">Done</option>
              </select>
            </div>
            <div>
              <label for="taskDueDate" class="text-sm font-medium text-gray-700">Due Date</label>
              <input
                id="taskDueDate"
                name="taskDueDate"
                type="date"
                class="mt-2 w-full px-3 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
              />
            </div>
          </div>

          <div class="flex items-center justify-end gap-3 pt-2">
            <button
              type="button"
              id="cancelNewTaskModal"
              class="px-4 py-2.5 rounded-lg border border-gray-200 text-sm font-semibold text-gray-700 hover:bg-gray-50 transition-colors"
            >
              Cancel
            </button>
            <button type="submit" class="px-4 py-2.5 rounded-lg bg-blue-600 text-white text-sm font-semibold hover:bg-blue-700 transition-colors">
              Create Task
            </button>
          </div>
        </form>
      </div>
    </div>

    <script type="module">
      import { BASE_URL } from "./js/config.js";

      const skeleton = document.getElementById("tasks_skeleton");
      const board = document.getElementById("tasks_board");
      const columns = {
        todo: document.getElementById("todo_column"),
        in_progress: document.getElementById("inprogress_column"),
        completed: document.getElementById("done_column"),
      };

      function setLoading(isLoading) {
        if (!skeleton || !board) return;
        skeleton.classList.toggle("hidden", !isLoading);
        board.classList.toggle("hidden", isLoading);
      }

      function renderEmpty(message) {
        Object.values(columns).forEach((col) => {
          if (!col) return;
          col.innerHTML = `<p class="text-sm text-gray-500">${message}</p>`;
        });
      }

      function createTaskCard(task) {
        const card = document.createElement("div");
        card.className = "bg-white rounded-xl p-4 shadow-sm border border-gray-100";

        const title = document.createElement("h4");
        title.className = "text-sm font-semibold text-gray-900 mb-1";
        title.textContent = task.title || "Untitled task";

        const desc = document.createElement("p");
        desc.className = "text-sm text-gray-600 leading-relaxed";
        desc.textContent = task.description || "No description";

        card.appendChild(title);
        card.appendChild(desc);
        return card;
      }

      function renderTasks(tasks) {
        Object.values(columns).forEach((col) => {
          if (col) col.innerHTML = "";
        });

        if (!tasks || tasks.length === 0) {
          renderEmpty("No tasks yet. Create one to get started.");
          return;
        }

        tasks.forEach((task) => {
          const status = task.status || "todo";
          const column = columns[status];
          const target = column || columns.todo;
          if (!target) return;
          target.appendChild(createTaskCard(task));
        });

        Object.entries(columns).forEach(([key, col]) => {
          if (col && col.children.length === 0) {
            col.innerHTML = `<p class="text-sm text-gray-400">No tasks in ${key.replace("_", " ")}</p>`;
          }
        });
      }

      async function loadTasks() {
        const token = localStorage.getItem("token");
        if (!token) {
          window.location.href = "index.html";
          return;
        }

        setLoading(true);
        try {
          const response = await fetch(BASE_URL + "/task/", {
            method: "GET",
            headers: {
              Authorization: "Bearer " + token,
            },
          });

          if (!response.ok) {
            console.error("Task fetch failed:", response.status);
            setLoading(false);
            renderEmpty("Unable to load tasks.");
            return;
          }

          const data = await response.json();
          const tasks = data.task || [];
          renderTasks(tasks);
        } catch (error) {
          console.error("Unable to load tasks:", error);
          renderEmpty("Unable to load tasks.");
        } finally {
          setLoading(false);
        }
      }

      document.addEventListener("DOMContentLoaded", loadTasks);

      // Modal controls (view only)
      const newTaskModal = document.getElementById("newTaskModal");
      const newTaskModalPanel = document.getElementById("newTaskModalPanel");
      const closeNewTaskModal = document.getElementById("closeNewTaskModal");
      const cancelNewTaskModal = document.getElementById("cancelNewTaskModal");
      const newTaskForm = document.getElementById("newTaskForm");
      const openNewTaskModalBtn = document.getElementById("openNewTaskModal");

      function showNewTaskModal() {
        if (!newTaskModal) return;
        newTaskModal.classList.remove("hidden");
        newTaskModal.classList.add("flex");
        newTaskModal.setAttribute("aria-hidden", "false");
      }

      function hideNewTaskModal() {
        if (!newTaskModal) return;
        newTaskModal.classList.add("hidden");
        newTaskModal.classList.remove("flex");
        newTaskModal.setAttribute("aria-hidden", "true");
      }

      if (openNewTaskModalBtn) {
        openNewTaskModalBtn.addEventListener("click", showNewTaskModal);
      }

      if (closeNewTaskModal) {
        closeNewTaskModal.addEventListener("click", hideNewTaskModal);
      }

      if (cancelNewTaskModal) {
        cancelNewTaskModal.addEventListener("click", hideNewTaskModal);
      }

      if (newTaskModal) {
        newTaskModal.addEventListener("click", function (event) {
          if (event.target === newTaskModal) {
            hideNewTaskModal();
          }
        });
      }

      if (newTaskModalPanel) {
        newTaskModalPanel.addEventListener("click", function (event) {
          event.stopPropagation();
        });
      }

      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") {
          hideNewTaskModal();
        }
      });

      if (newTaskForm) {
        newTaskForm.addEventListener("submit", function (event) {
          event.preventDefault();
          newTaskForm.reset();
          hideNewTaskModal();
        });
      }
    </script>
  </body>
</html>
