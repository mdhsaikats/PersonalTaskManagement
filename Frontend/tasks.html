<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>TaskMinder Tasks</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>

  <body class="bg-gray-50">
    <div class="flex min-h-screen">
      <!-- Sidebar -->
      <aside
        class="w-[240px] bg-white border-r border-gray-200 flex flex-col fixed h-full z-10"
      >
        <!-- Logo -->
        <div class="flex items-center gap-3 px-5 py-6">
          <div class="flex h-12 w-12 items-center justify-center">
            <img
              src="../asset/logo.png"
              alt="TaskMinder logo"
              class="h-12 w-12 object-contain"
            />
          </div>
          <div>
            <h1 class="text-base font-bold text-gray-900 leading-tight">
              TaskMinder
            </h1>
            <p class="text-xs text-gray-400">Productivity App</p>
          </div>
        </div>

        <!-- Navigation -->
        <nav class="flex-1 flex flex-col gap-1 px-3 mt-2">
          <a
            href="dashboard.html"
            class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100 transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-500 focus-visible:outline-offset-2"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-5 h-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"
              />
            </svg>
            Dashboard
          </a>

          <a
            href="projects.html"
            class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100 transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-500 focus-visible:outline-offset-2"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-5 h-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"
              />
            </svg>
            Projects
          </a>

          <a
            href="tasks.html"
            class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-semibold text-white bg-blue-600 shadow-sm transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-500 focus-visible:outline-offset-2"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-5 h-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"
              />
            </svg>
            Tasks
          </a>

          <a
            href="calendar.html"
            class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100 transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-500 focus-visible:outline-offset-2"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-5 h-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
              />
            </svg>
            Calendar
          </a>

          <a
            href="setting.html"
            class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100 transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-500 focus-visible:outline-offset-2"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-5 h-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
              />
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
              />
            </svg>
            Settings
          </a>
        </nav>

        <!-- Logout -->
        <div class="px-4 py-4 border-t border-gray-200">
          <button
            class="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg bg-red-50 text-red-600 border border-red-100 hover:bg-red-100 transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-red-500 focus-visible:outline-offset-2"
            onclick="
              localStorage.removeItem('token');
              window.location.href = 'index.html';
            "
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-5 h-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M17 16l4-4m0 0l-4-4m4 4H7"
              />
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M3 21h8a2 2 0 002-2v-2"
              />
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M13 5V3a2 2 0 00-2-2H3a2 2 0 00-2 2v16a2 2 0 002 2h8a2 2 0 002-2v-2"
              />
            </svg>
            Logout
          </button>
        </div>
      </aside>

      <!-- Main Area -->
      <div class="flex-1 flex flex-col ml-[240px]">
        <!-- Top Header -->
        <header
          class="flex items-center justify-between bg-white px-8 py-4 border-b border-gray-200 sticky top-0 z-[5]"
        >
          <div class="flex items-center gap-3">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-6 h-6 text-blue-600"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"
              />
            </svg>
            <h1 class="text-xl font-bold text-gray-900">Tasks</h1>
          </div>
        </header>

        <!-- Main Content: Kanban Board -->
        <main class="p-8 flex-1 overflow-auto">
          <div id="tasks_skeleton" class="grid grid-cols-3 gap-6">
            <div class="flex flex-col">
              <div class="flex items-center gap-2 mb-4 px-1">
                <div
                  class="w-5 h-5 rounded-full bg-gray-200 animate-pulse"
                ></div>
                <div
                  class="h-4 w-20 bg-gray-200 rounded-md animate-pulse"
                ></div>
              </div>
              <div
                class="bg-gray-100/70 rounded-2xl p-3 flex flex-col gap-3 flex-1"
              >
                <div class="bg-white rounded-xl p-4 border border-gray-100">
                  <div
                    class="h-3 w-24 bg-gray-200 rounded-md animate-pulse mb-3"
                  ></div>
                  <div
                    class="h-4 w-32 bg-gray-200 rounded-md animate-pulse mb-2"
                  ></div>
                  <div
                    class="h-3 w-full bg-gray-100 rounded-md animate-pulse"
                  ></div>
                </div>
                <div class="bg-white rounded-xl p-4 border border-gray-100">
                  <div
                    class="h-3 w-24 bg-gray-200 rounded-md animate-pulse mb-3"
                  ></div>
                  <div
                    class="h-4 w-32 bg-gray-200 rounded-md animate-pulse mb-2"
                  ></div>
                  <div
                    class="h-3 w-full bg-gray-100 rounded-md animate-pulse"
                  ></div>
                </div>
              </div>
            </div>
            <div class="flex flex-col">
              <div class="flex items-center gap-2 mb-4 px-1">
                <div
                  class="w-5 h-5 rounded-full bg-gray-200 animate-pulse"
                ></div>
                <div
                  class="h-4 w-20 bg-gray-200 rounded-md animate-pulse"
                ></div>
              </div>
              <div
                class="bg-gray-100/70 rounded-2xl p-3 flex flex-col gap-3 flex-1"
              >
                <div class="bg-white rounded-xl p-4 border border-gray-100">
                  <div
                    class="h-3 w-24 bg-gray-200 rounded-md animate-pulse mb-3"
                  ></div>
                  <div
                    class="h-4 w-32 bg-gray-200 rounded-md animate-pulse mb-2"
                  ></div>
                  <div
                    class="h-3 w-full bg-gray-100 rounded-md animate-pulse"
                  ></div>
                </div>
                <div class="bg-white rounded-xl p-4 border border-gray-100">
                  <div
                    class="h-3 w-24 bg-gray-200 rounded-md animate-pulse mb-3"
                  ></div>
                  <div
                    class="h-4 w-32 bg-gray-200 rounded-md animate-pulse mb-2"
                  ></div>
                  <div
                    class="h-3 w-full bg-gray-100 rounded-md animate-pulse"
                  ></div>
                </div>
              </div>
            </div>
            <div class="flex flex-col">
              <div class="flex items-center gap-2 mb-4 px-1">
                <div
                  class="w-5 h-5 rounded-full bg-gray-200 animate-pulse"
                ></div>
                <div
                  class="h-4 w-20 bg-gray-200 rounded-md animate-pulse"
                ></div>
              </div>
              <div
                class="bg-gray-100/70 rounded-2xl p-3 flex flex-col gap-3 flex-1"
              >
                <div class="bg-white rounded-xl p-4 border border-gray-100">
                  <div
                    class="h-3 w-24 bg-gray-200 rounded-md animate-pulse mb-3"
                  ></div>
                  <div
                    class="h-4 w-32 bg-gray-200 rounded-md animate-pulse mb-2"
                  ></div>
                  <div
                    class="h-3 w-full bg-gray-100 rounded-md animate-pulse"
                  ></div>
                </div>
                <div class="bg-white rounded-xl p-4 border border-gray-100">
                  <div
                    class="h-3 w-24 bg-gray-200 rounded-md animate-pulse mb-3"
                  ></div>
                  <div
                    class="h-4 w-32 bg-gray-200 rounded-md animate-pulse mb-2"
                  ></div>
                  <div
                    class="h-3 w-full bg-gray-100 rounded-md animate-pulse"
                  ></div>
                </div>
              </div>
            </div>
          </div>

          <div class="grid grid-cols-3 gap-6 h-full hidden" id="tasks_board">
            <!-- Column: To Do -->
            <div class="flex flex-col">
              <div class="flex items-center gap-2 mb-4 px-1">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="w-5 h-5 text-gray-400"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <rect x="3" y="3" width="18" height="18" rx="2" />
                </svg>
                <h3 class="text-sm font-bold text-gray-700">To do</h3>
              </div>
              <div
                id="todo_column"
                class="bg-gray-100/70 rounded-2xl p-3 flex flex-col gap-3 flex-1"
              ></div>
            </div>

            <!-- Column: In Progress -->
            <div class="flex flex-col">
              <div class="flex items-center gap-2 mb-4 px-1">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="w-5 h-5 text-amber-500"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
                  />
                </svg>
                <h3 class="text-sm font-bold text-gray-700">In progress</h3>
              </div>
              <div
                id="inprogress_column"
                class="bg-gray-100/70 rounded-2xl p-3 flex flex-col gap-3 flex-1"
              ></div>
            </div>

            <!-- Column: Done -->
            <div class="flex flex-col">
              <div class="flex items-center gap-2 mb-4 px-1">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="w-5 h-5 text-green-500"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"
                  />
                </svg>
                <h3 class="text-sm font-bold text-gray-700">Done</h3>
              </div>
              <div
                id="done_column"
                class="bg-gray-100/70 rounded-2xl p-3 flex flex-col gap-3 flex-1"
              ></div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script type="module" src="js/task.js"></script>
  </body>
</html>
