<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>TaskMinder Dashboard</title>
  </head>

  <body class="bg-gray-100">
    <div class="flex min-h-screen">
      <!-- Sidebar -->
      <aside class="w-[260px] bg-white border-r border-gray-300 flex flex-col">
        <h1 class="text-2xl font-bold text-center py-5 border-b">
          TaskMinder.
        </h1>

        <nav class="flex-1 flex flex-col gap-3 p-4">
          <!-- Dashboard -->
          <a
            href="dashboard.html"
            class="flex items-center gap-3 p-2 rounded-lg font-semibold text-blue-900 bg-blue-200 hover:bg-blue-600 hover:text-white duration-300"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-5 h-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M3 13h8V3H3v10zm10 8h8V11h-8v10zM3 21h8v-6H3v6zm10-8h8V3h-8v10z"
              />
            </svg>

            Dashboard
          </a>

          <!-- Projects -->
          <a
            href="projects.html"
            class="flex items-center gap-3 p-2 rounded-lg font-semibold text-blue-900 bg-blue-200 hover:bg-blue-600 hover:text-white duration-300"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-5 h-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M3 7a2 2 0 012-2h5l2 2h7a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"
              />
            </svg>

            Projects
          </a>

          <!-- Tasks -->
          <a
            href="tasks.html"
            class="flex items-center gap-3 p-2 rounded-lg font-semibold text-blue-900 bg-blue-200 hover:bg-blue-600 hover:text-white duration-300"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-5 h-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 5h12M9 12h12M9 19h12M5 6h.01M5 13h.01M5 20h.01"
              />
            </svg>

            Tasks
          </a>

          <!-- Calendar -->
          <a
            href="calendar.html"
            class="flex items-center gap-3 p-2 rounded-lg font-semibold text-blue-900 bg-blue-200 hover:bg-blue-600 hover:text-white duration-300"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-5 h-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
              />
            </svg>

            Calendar
          </a>
        </nav>
        <div class="flex flex-col gap-3 p-4 mt-auto">
          <button
            class="flex items-center gap-3 p-2 font-bold flex justify-center items-center rounded-lg font-semibold text-red-700 bg-red-200 hover:bg-red-600 hover:text-white duration-300"
          >
            Log out
          </button>
        </div>
      </aside>

      <!-- Main Area -->
      <div class="flex-1 flex flex-col">
        <!-- Top Header -->
        <header class="flex justify-between items-center bg-white p-4 border-b">
          <!-- Search -->
          <input
            type="text"
            placeholder="Search..."
            class="border rounded-lg px-3 py-1 w-[250px]"
          />

          <!-- Icons -->
          <div class="flex gap-4">
            <button class="text-gray-600 hover:text-black">🔔</button>

            <button class="text-gray-600 hover:text-black">👤</button>
          </div>
        </header>

        <!-- Main Content -->
        <main class="p-6 bg-gray-100">
          <div class="flex flex-row items-center gap-4 justify-evenly">
            <div
              class="relative w-[500px] h-44 overflow-hidden rounded-3xl border border-blue-100 bg-gradient-to-br from-white via-blue-50 to-blue-100/60 p-5 shadow-[0_10px_30px_rgba(59,130,246,0.15)]"
            >
              <div
                class="pointer-events-none absolute -right-8 -top-8 h-24 w-24 rounded-full bg-blue-200/60"
              ></div>

              <div class="relative z-10 flex h-full flex-col justify-between">
                <div class="flex items-start justify-between">
                  <div class="flex items-center gap-3">
                    <div
                      class="flex h-12 w-12 items-center justify-center rounded-2xl bg-blue-500 shadow-md shadow-blue-300/60"
                    >
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        class="h-6 w-6 text-white"
                        viewBox="0 0 24 24"
                        fill="none"
                      >
                        <path
                          d="M7 12l3 3 7-7"
                          stroke="white"
                          stroke-width="2"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        />
                      </svg>
                    </div>

                    <div>
                      <p class="text-sm font-medium text-blue-800/80">
                        Overview
                      </p>
                      <h1
                        class="text-lg font-semibold tracking-tight text-gray-800"
                      >
                        Total Task
                      </h1>
                    </div>
                  </div>

                  <span
                    class="rounded-full border border-blue-200 bg-white/80 px-2.5 py-1 text-xs font-semibold text-blue-700"
                  >
                    +5%
                  </span>
                </div>

                <div>
                  <p class="text-4xl font-bold leading-none text-gray-900">
                    100
                  </p>
                  <div
                    class="mt-3 h-2 w-full overflow-hidden rounded-full bg-blue-100"
                  >
                    <div class="h-full w-[68%] rounded-full bg-blue-500"></div>
                  </div>
                  <p class="mt-2 text-xs font-medium text-blue-700">
                    68 completed this week
                  </p>
                </div>
              </div>
            </div>
            <div
              class="relative w-[500px] h-44 overflow-hidden rounded-3xl border border-amber-100 bg-gradient-to-br from-white via-amber-50 to-amber-100/70 p-5 shadow-[0_10px_30px_rgba(245,158,11,0.15)]"
            >
              <div
                class="pointer-events-none absolute -right-8 -top-8 h-24 w-24 rounded-full bg-amber-200/60"
              ></div>

              <div class="relative z-10 flex h-full flex-col justify-between">
                <div class="flex items-start justify-between">
                  <div class="flex items-center gap-3">
                    <div
                      class="flex h-12 w-12 items-center justify-center rounded-2xl bg-amber-500 shadow-md shadow-amber-300/60"
                    >
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        class="h-6 w-6 text-white"
                        viewBox="0 0 24 24"
                        fill="none"
                      >
                        <path
                          d="M12 6v6l4 2"
                          stroke="white"
                          stroke-width="2"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        />
                        <circle
                          cx="12"
                          cy="12"
                          r="8"
                          stroke="white"
                          stroke-width="2"
                        />
                      </svg>
                    </div>

                    <div>
                      <p class="text-sm font-medium text-amber-800/80">
                        Status
                      </p>
                      <h1
                        class="text-lg font-semibold tracking-tight text-gray-800"
                      >
                        In Progress
                      </h1>
                    </div>
                  </div>

                  <span
                    class="rounded-full border border-amber-200 bg-white/80 px-2.5 py-1 text-xs font-semibold text-amber-700"
                  >
                    42%
                  </span>
                </div>

                <div>
                  <p class="text-4xl font-bold leading-none text-gray-900">
                    42
                  </p>
                  <div
                    class="mt-3 h-2 w-full overflow-hidden rounded-full bg-amber-100"
                  >
                    <div class="h-full w-[42%] rounded-full bg-amber-500"></div>
                  </div>
                  <p class="mt-2 text-xs font-medium text-amber-700">
                    42 tasks currently active
                  </p>
                </div>
              </div>
            </div>
            <div
              class="relative w-[500px] h-44 overflow-hidden rounded-3xl border border-green-100 bg-gradient-to-br from-white via-green-50 to-green-100/70 p-5 shadow-[0_10px_30px_rgba(34,197,94,0.15)]"
            >
              <div
                class="pointer-events-none absolute -right-8 -top-8 h-24 w-24 rounded-full bg-green-200/60"
              ></div>

              <div class="relative z-10 flex h-full flex-col justify-between">
                <div class="flex items-start justify-between">
                  <div class="flex items-center gap-3">
                    <div
                      class="flex h-12 w-12 items-center justify-center rounded-2xl bg-green-500 shadow-md shadow-green-300/60"
                    >
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        class="h-6 w-6 text-white"
                        viewBox="0 0 24 24"
                        fill="none"
                      >
                        <path
                          d="M6 12l4 4 8-8"
                          stroke="white"
                          stroke-width="2"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        />
                      </svg>
                    </div>

                    <div>
                      <p class="text-sm font-medium text-green-800/80">
                        Result
                      </p>
                      <h1
                        class="text-lg font-semibold tracking-tight text-gray-800"
                      >
                        Completed
                      </h1>
                    </div>
                  </div>

                  <span
                    class="rounded-full border border-green-200 bg-white/80 px-2.5 py-1 text-xs font-semibold text-green-700"
                  >
                    78%
                  </span>
                </div>

                <div>
                  <p class="text-4xl font-bold leading-none text-gray-900">
                    78
                  </p>
                  <div
                    class="mt-3 h-2 w-full overflow-hidden rounded-full bg-green-100"
                  >
                    <div class="h-full w-[78%] rounded-full bg-green-500"></div>
                  </div>
                  <p class="mt-2 text-xs font-medium text-green-700">
                    78 tasks finished this week
                  </p>
                </div>
              </div>
            </div>
          </div>
          <div class="flex flex-row m-4 gap-6">
            <div
              class="border border-blue-300 w-[1000px] h-[620px] rounded-2xl shadow-lg hover:shadow-blue-100 duration-300 ease-in-out"
            >
              <div
                class="flex justify-between items-center border-b border-gray-300"
              >
                <h1 class="text-xl font-bold p-6">Recent Activity</h1>
                <a class="text-blue-700 p-6 hover:underline">View All</a>
              </div>
            </div>
            <div class="flex flex-col gap-4">
              <div
                class="border border-blue-300 w-[550px] h-[300px] rounded-2xl shadow-lg hover:shadow-blue-100 duration-300 ease-in-out"
              ></div>
              <div
                class="border border-blue-300 w-[550px] h-[300px] rounded-2xl shadow-lg hover:shadow-blue-100 duration-300 ease-in-out"
              ></div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
