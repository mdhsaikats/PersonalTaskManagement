<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Login - page</title>
  </head>
  <body>
    <div class="flex justify-center items-center min-h-screen bg-gray-100">
      <div class="bg-white border-2 border-black w-96 p-6 rounded-lg shadow-lg">
        <h1 class="text-2xl font-bold text-center mb-4">Registration Page</h1>
        <div class="border-b border-black mb-6"></div>

        <form action="/submit" method="post" class="flex flex-col">
          <!-- Email -->
          <label for="email" class="mb-2 font-medium">Email</label>
          <input
            type="text"
            name="username"
            id="email"
            placeholder="Enter your email"
            class="border border-black rounded px-3 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500"
            required
          />

          <!-- Password -->
          <label for="password" class="mb-2 font-medium">Password</label>
          <input
            type="password"
            name="password"
            id="password"
            placeholder="Enter your password"
            class="border border-black rounded px-3 py-2 mb-6 focus:outline-none focus:ring-2 focus:ring-blue-500"
            required
          />
          <label for="password" class="mb-2 font-medium"
            >Confirm Password</label
          >
          <input
            type="password"
            name="password"
            id="password"
            placeholder="Enter your password"
            class="border border-black rounded px-3 py-2 mb-6 focus:outline-none focus:ring-2 focus:ring-blue-500"
            required
          />

          <!-- Submit Button -->
          <button
            type="submit"
            class="bg-black text-white py-2 rounded hover:bg-white hover:border hover:border-black hover:text-black transition-colors mb-4"
          >
            Submit
          </button>
          <p class="flex justify-center">
            Have an account?
            <a
              href="index.html"
              class="text-blue-500 hover:underline transition duration-300"
              >Login</a
            >
          </p>
        </form>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
