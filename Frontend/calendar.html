<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>TaskMinder - Calendar</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");
      body {
        font-family: "Inter", sans-serif;
      }
      /* Clean, modern scrollbar for the calendar grid */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #e5e7eb;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #d1d5db;
      }
    </style>
  </head>

  <body class="bg-gray-50 text-gray-900 overflow-hidden">
    <div class="flex h-screen w-full">
      <aside class="w-[240px] bg-white border-r border-gray-200 flex flex-col shrink-0 z-20">
        <div class="flex items-center gap-3 px-5 py-6">
            <img src="../asset/logo.png" alt="TaskMinder Logo" class="h-12 w-12 object-contain">
          <div>
            <h1 class="text-base font-bold text-gray-900 leading-tight">
              TaskMinder
            </h1>
            <p class="text-[11px] font-medium text-gray-400 uppercase tracking-wider mt-0.5">Productivity</p>
          </div>
        </div>

        <nav class="flex-1 flex flex-col gap-1 px-3 mt-2">
          <a href="dashboard.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50 hover:text-gray-900 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
            Dashboard
          </a>
          <a href="projects.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50 hover:text-gray-900 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
            Projects
          </a>
          <a href="tasks.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50 hover:text-gray-900 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
            Tasks
          </a>
          <a href="calendar.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-semibold text-blue-700 bg-blue-50 relative before:absolute before:inset-y-0 before:left-0 before:w-1 before:bg-blue-600 before:rounded-r-lg">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
            Calendar
          </a>
          <a href="setting.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50 hover:text-gray-900 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            Settings
          </a>
        </nav>

        <div class="p-4">
          <button class="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-red-50 hover:text-red-600 transition-colors" onclick="localStorage.removeItem('token'); window.location.href='index.html';">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7"/><path stroke-linecap="round" stroke-linejoin="round" d="M3 21h8a2 2 0 002-2v-2"/><path stroke-linecap="round" stroke-linejoin="round" d="M13 5V3a2 2 0 00-2-2H3a2 2 0 00-2 2v16a2 2 0 002 2h8a2 2 0 002-2v-2"/></svg>
            Logout
          </button>
        </div>
      </aside>

      <div class="flex-1 flex flex-col h-full bg-white relative z-10 shadow-[-10px_0_15px_-3px_rgba(0,0,0,0.03)] rounded-l-3xl overflow-hidden">
        <header class="flex justify-between items-center px-8 py-5 border-b border-gray-100 bg-white z-20">
          <div class="flex items-center gap-6">
            <h1 id="month_label" class="text-2xl font-bold text-gray-900 tracking-tight min-w-[200px]">&nbsp;</h1>
            <div class="flex items-center gap-2">
              <button id="today_btn" class="px-3.5 py-1.5 text-sm font-semibold text-gray-700 bg-white border border-gray-200 rounded-md hover:bg-gray-50 hover:border-gray-300 transition-all shadow-sm">
                Today
              </button>
              <div class="flex items-center bg-gray-50 border border-gray-200 rounded-md p-0.5 shadow-sm">
                <button id="prev_month" class="p-1 text-gray-400 hover:text-gray-900 hover:bg-white rounded transition-all">
                  <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" /></svg>
                </button>
                <div class="w-px h-4 bg-gray-200 mx-0.5"></div>
                <button id="next_month" class="p-1 text-gray-400 hover:text-gray-900 hover:bg-white rounded transition-all">
                  <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" /></svg>
                </button>
              </div>
            </div>
          </div>
          
          <div class="flex items-center bg-gray-100/80 p-1 rounded-lg border border-gray-200/60 shadow-inner">
            <button id="day_btn" class="px-4 py-1.5 text-sm font-medium rounded-md text-gray-500 hover:text-gray-900 transition-all">Day</button>
            <button id="week_btn" class="px-4 py-1.5 text-sm font-medium rounded-md text-gray-500 hover:text-gray-900 transition-all">Week</button>
            <button id="month_btn" class="px-4 py-1.5 text-sm font-semibold rounded-md text-gray-900 bg-white shadow-sm ring-1 ring-gray-200/50 transition-all">Month</button>
          </div>
        </header>

        <main class="flex-1 flex flex-col overflow-hidden bg-white">
          <div id="calendar_headers" class="grid grid-cols-7 border-b border-gray-100 bg-gray-50/50"></div>
          
          <div class="flex-1 overflow-y-auto overflow-x-hidden relative">
            <div id="calendar_grid" class="grid grid-cols-7 grid-rows-6 h-full min-h-[600px]"></div>
          </div>
        </main>
      </div>
    </div>
    <script type="module" src="js/calender.js"></script>
  </body>
</html>
