<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>TaskMinder Dashboard</title>
  </head>

  <body class="bg-gray-100">
    <div class="flex min-h-screen">
      <!-- Sidebar -->
      <aside class="w-[260px] bg-white border-r border-gray-300 flex flex-col">
        <h1 class="text-2xl font-bold text-center py-5 border-b">
          TaskMinder.
        </h1>

        <nav class="flex-1 flex flex-col gap-3 p-4">
          <!-- Dashboard -->
          <a
            href="dashboard.html"
            class="flex items-center gap-3 p-2 rounded-lg font-semibold text-blue-900 bg-blue-200 hover:bg-blue-600 hover:text-white duration-300"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-5 h-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M3 13h8V3H3v10zm10 8h8V11h-8v10zM3 21h8v-6H3v6zm10-8h8V3h-8v10z"
              />
            </svg>

            Dashboard
          </a>

          <!-- Projects -->
          <a
            href="projects.html"
            class="flex items-center gap-3 p-2 rounded-lg font-semibold text-blue-900 bg-blue-200 hover:bg-blue-600 hover:text-white duration-300"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-5 h-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M3 7a2 2 0 012-2h5l2 2h7a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"
              />
            </svg>

            Projects
          </a>

          <!-- Tasks -->
          <a
            href="tasks.html"
            class="flex items-center gap-3 p-2 rounded-lg font-semibold text-blue-900 bg-blue-200 hover:bg-blue-600 hover:text-white duration-300"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-5 h-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 5h12M9 12h12M9 19h12M5 6h.01M5 13h.01M5 20h.01"
              />
            </svg>

            Tasks
          </a>

          <!-- Calendar -->
          <a
            href="calendar.html"
            class="flex items-center gap-3 p-2 rounded-lg font-semibold text-blue-900 bg-blue-200 hover:bg-blue-600 hover:text-white duration-300"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-5 h-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
              />
            </svg>

            Calendar
          </a>
        </nav>
        <div class="flex flex-col gap-3 p-4 mt-auto">
          <button
            class="flex items-center gap-3 p-2 font-bold flex justify-center items-center rounded-lg font-semibold text-red-700 bg-red-200 hover:bg-red-600 hover:text-white duration-300"
          >
            Log out
          </button>
        </div>
      </aside>

      <!-- Main Area -->
      <div class="flex-1 flex flex-col">
        <!-- Top Header -->
        <header class="flex justify-between items-center bg-white p-4 border-b">
          <!-- Search -->
          <input
            type="text"
            placeholder="Search..."
            class="border rounded-lg px-3 py-1 w-[250px]"
          />

          <!-- Icons -->
          <div class="flex gap-4">
            <button class="text-gray-600 hover:text-black">🔔</button>

            <button class="text-gray-600 hover:text-black">👤</button>
          </div>
        </header>

        <!-- Main Content -->
        <main class="p-6">
          <h2 class="text-2xl font-bold">Welcome to your dashboard</h2>
        </main>
      </div>
    </div>
  </body>
</html>
