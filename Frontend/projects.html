<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>TaskMinder - Projects</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap");
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>

  <body class="bg-gray-50">
    <div class="flex min-h-screen">
      <!-- Sidebar -->
      <aside
        class="w-[240px] bg-white border-r border-gray-200 flex flex-col fixed h-full z-10"
      >
        <!-- Logo -->
        <div class="flex items-center gap-3 px-5 py-6">
          <div class="flex h-12 w-12 items-center justify-center">
            <img src="../asset/logo.png" alt="TaskMinder logo" class="h-12 w-12 object-contain" />
          </div>
          <div>
            <h1 class="text-base font-bold text-gray-900 leading-tight">
              TaskMinder
            </h1>
            <p class="text-xs text-gray-400">Productivity App</p>
          </div>
        </div>

        <!-- Navigation -->
        <nav class="flex-1 flex flex-col gap-1 px-3 mt-2">
          <!-- Dashboard -->
          <a
            href="dashboard.html"
            class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100 transition-colors"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-5 h-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"
              />
            </svg>
            Dashboard
          </a>

          <!-- Projects (Active) -->
          <a
            href="projects.html"
            class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-semibold text-white bg-blue-600 shadow-sm"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-5 h-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"
              />
            </svg>
            Projects
          </a>

          <!-- Tasks -->
          <a
            href="tasks.html"
            class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100 transition-colors"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-5 h-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"
              />
            </svg>
            Tasks
          </a>

          <!-- Calendar -->
          <a
            href="calendar.html"
            class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100 transition-colors"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-5 h-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
              />
            </svg>
            Calendar
          </a>

          <a
            href="setting.html"
            class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100 transition-colors"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-5 h-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
              />
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
              />
            </svg>
            Settings
          </a>
        </nav>

        <!-- Logout -->
        <div class="px-4 py-4 border-t border-gray-200">
          <button
            class="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg bg-red-50 text-red-600 border border-red-100 hover:bg-red-100 transition-colors"
            onclick="localStorage.removeItem('token'); window.location.href='index.html';"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-5 h-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M17 16l4-4m0 0l-4-4m4 4H7"
              />
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M3 21h8a2 2 0 002-2v-2"
              />
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M13 5V3a2 2 0 00-2-2H3a2 2 0 00-2 2v16a2 2 0 002 2h8a2 2 0 002-2v-2"
              />
            </svg>
            Logout
          </button>
        </div>
      </aside>

      <!-- Main Area -->
      <div class="flex-1 flex flex-col ml-[240px]">
        <!-- Top Header -->
        <header
          class="flex justify-between items-center bg-white px-8 py-4 border-b border-gray-200 sticky top-0 z-[5]"
        >
          <h1 class="text-xl font-bold text-gray-900">Projects</h1>

          <div class="flex items-center gap-4">
            <div class="relative">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                />
              </svg>
              <input
                type="text"
                placeholder="Search projects..."
                class="bg-gray-50 border border-gray-200 rounded-lg pl-10 pr-4 py-2 text-sm w-[220px] focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent placeholder-gray-400"
              />
            </div>
          </div>
        </header>

        <!-- Main Content -->
        <main class="p-8">
          <!-- Page Heading -->
          <div class="flex items-start justify-between mb-8">
            <div>
              <h2 class="text-2xl font-extrabold text-gray-900">
                Active Projects
              </h2>
              <p class="text-sm text-gray-500 mt-1">
                Manage and track your ongoing workspace projects.
              </p>
            </div>
            <button
              id="openCreateProjectModal"
              class="flex items-center gap-2 bg-blue-600 text-white text-sm font-semibold px-5 py-2.5 rounded-lg hover:bg-blue-700 transition-colors shadow-sm"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="w-4 h-4"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2.5"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M12 4v16m8-8H4"
                />
              </svg>
              Create New Project
            </button>
          </div>

          <!-- Project Cards Grid -->
          <div class="grid grid-cols-3 gap-6" id="project_grid"></div>

          <div id="project_skeleton" class="grid grid-cols-3 gap-6 mt-4">
            <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6 animate-pulse">
              <div class="flex items-start justify-between mb-4">
                <div class="h-11 w-11 rounded-xl bg-gray-200"></div>
                <div class="h-5 w-16 rounded-full bg-gray-200"></div>
              </div>
              <div class="h-4 w-32 bg-gray-200 rounded mb-2"></div>
              <div class="h-3 w-full bg-gray-200 rounded mb-4"></div>
              <div class="h-2 w-full bg-gray-200 rounded"></div>
            </div>
            <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6 animate-pulse">
              <div class="flex items-start justify-between mb-4">
                <div class="h-11 w-11 rounded-xl bg-gray-200"></div>
                <div class="h-5 w-16 rounded-full bg-gray-200"></div>
              </div>
              <div class="h-4 w-28 bg-gray-200 rounded mb-2"></div>
              <div class="h-3 w-full bg-gray-200 rounded mb-4"></div>
              <div class="h-2 w-full bg-gray-200 rounded"></div>
            </div>
            <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6 animate-pulse">
              <div class="flex items-start justify-between mb-4">
                <div class="h-11 w-11 rounded-xl bg-gray-200"></div>
                <div class="h-5 w-16 rounded-full bg-gray-200"></div>
              </div>
              <div class="h-4 w-24 bg-gray-200 rounded mb-2"></div>
              <div class="h-3 w-full bg-gray-200 rounded mb-4"></div>
              <div class="h-2 w-full bg-gray-200 rounded"></div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <div
      id="createProjectModal"
      class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50 p-4"
      aria-hidden="true"
    >
      <div
        id="createProjectModalPanel"
        class="w-full max-w-2xl bg-white rounded-2xl shadow-xl border border-gray-200"
      >
        <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100">
          <h3 class="text-lg font-bold text-gray-900">Create New Project</h3>
          <button
            id="closeCreateProjectModal"
            class="p-2 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-lg transition-colors"
            aria-label="Close create project modal"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-5 h-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>

        <form id="createProjectForm" class="px-6 py-5 space-y-4">
          <div>
            <label for="projectName" class="text-sm font-medium text-gray-700">Project Name</label>
            <input
              id="projectName"
              name="projectName"
              type="text"
              required
              placeholder="Enter project name"
              class="mt-2 w-full px-3 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>

          <div>
            <label for="projectDescription" class="text-sm font-medium text-gray-700">Description</label>
            <textarea
              id="projectDescription"
              name="projectDescription"
              rows="4"
              placeholder="Write a short project summary"
              class="mt-2 w-full px-3 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"
            ></textarea>
          </div>

          <!-- Due date removed -->

          <div class="flex items-center justify-end gap-3 pt-2">
            <button
              type="button"
              id="cancelCreateProject"
              class="px-4 py-2.5 rounded-lg border border-gray-200 text-sm font-semibold text-gray-700 hover:bg-gray-50 transition-colors"
            >
              Cancel
            </button>
            <button
              type="submit"
              class="px-4 py-2.5 rounded-lg bg-blue-600 text-white text-sm font-semibold hover:bg-blue-700 transition-colors"
            >
              Create Project
            </button>
          </div>
        </form>
      </div>
    </div>

    <div
      id="addProjectTaskModal"
      class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50 p-4"
      aria-hidden="true"
    >
      <div
        id="addProjectTaskModalPanel"
        class="w-full max-w-xl bg-white rounded-2xl shadow-xl border border-gray-200"
      >
        <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100">
          <h3 id="addProjectTaskModalTitle" class="text-lg font-bold text-gray-900">Add Task</h3>
          <button
            id="closeAddProjectTaskModal"
            class="p-2 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-lg transition-colors"
            aria-label="Close add task modal"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-5 h-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>

        <form id="addProjectTaskForm" class="px-6 py-5 space-y-4">
          <input type="hidden" id="selectedProjectId" name="selectedProjectId" />

          <div>
            <label for="projectTaskTitle" class="text-sm font-medium text-gray-700">Task Title</label>
            <input
              id="projectTaskTitle"
              name="projectTaskTitle"
              type="text"
              required
              placeholder="Enter task title"
              class="mt-2 w-full px-3 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>

          <div>
            <label for="projectTaskDescription" class="text-sm font-medium text-gray-700">Description</label>
            <textarea
              id="projectTaskDescription"
              name="projectTaskDescription"
              rows="4"
              placeholder="Write task details"
              class="mt-2 w-full px-3 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"
            ></textarea>
          </div>

          <div>
            <label for="projectTaskDueDate" class="text-sm font-medium text-gray-700">Due Date</label>
            <input
              id="projectTaskDueDate"
              name="projectTaskDueDate"
              type="date"
              class="mt-2 w-full px-3 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>

          <div class="flex items-center justify-end gap-3 pt-2">
            <button
              type="button"
              id="cancelAddProjectTask"
              class="px-4 py-2.5 rounded-lg border border-gray-200 text-sm font-semibold text-gray-700 hover:bg-gray-50 transition-colors"
            >
              Cancel
            </button>
            <button
              type="submit"
              class="px-4 py-2.5 rounded-lg bg-blue-600 text-white text-sm font-semibold hover:bg-blue-700 transition-colors"
            >
              Add Task
            </button>
          </div>
        </form>
      </div>
    </div>


    <script src="js/project.js" type="module"></script>

  </body>
</html>
