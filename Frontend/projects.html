              <div class="h-3 w-full bg-gray-200 rounded mb-4"></div>

            </div>

              <div class="flex items-start justify-between mb-4">

                <div class="h-5 w-16 rounded-full bg-gray-200"></div>
              </div>
              <div class="h-4 w-28 bg-gray-200 rounded mb-2"></div>
              <div class="h-3 w-full bg-gray-200 rounded mb-4"></div>
              <div class="h-2 w-full bg-gray-200 rounded"></div>

                <div class="h-5 w-16 rounded-full bg-gray-200"></div>
              </div>
              <div class="h-4 w-24 bg-gray-200 rounded mb-2"></div>

    <div
      id="createProjectModal"
      class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50 p-4"
      aria-hidden="true"
    >
      <div
        id="createProjectModalPanel"
        class="w-full max-w-2xl bg-white rounded-2xl shadow-xl border border-gray-200"
      >
        <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100">
          <h3 class="text-lg font-bold text-gray-900">Create New Project</h3>
          <button
            id="closeCreateProjectModal"
            class="p-2 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-lg transition-colors"
            aria-label="Close create project modal"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-5 h-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>

        <form id="createProjectForm" class="px-6 py-5 space-y-4">
          <div>
            <label for="projectName" class="text-sm font-medium text-gray-700">Project Name</label>
            <input
              id="projectName"
              name="projectName"
              type="text"
              required
              placeholder="Enter project name"
              class="mt-2 w-full px-3 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>

          <div>
            <label for="projectDescription" class="text-sm font-medium text-gray-700">Description</label>
            <textarea
              id="projectDescription"
              name="projectDescription"
              rows="4"
              placeholder="Write a short project summary"
              class="mt-2 w-full px-3 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"
            ></textarea>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label for="projectDueDate" class="text-sm font-medium text-gray-700">Due Date</label>
              <input
                id="projectDueDate"
                name="projectDueDate"
                type="date"
                class="mt-2 w-full px-3 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
              />
            </div>
            <div>
              <label for="projectStatus" class="text-sm font-medium text-gray-700">Status</label>
              <select
                id="projectStatus"
                name="projectStatus"
                class="mt-2 w-full px-3 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
              >
                <option value="active">Active</option>
                <option value="on-hold">On Hold</option>
                <option value="completed">Completed</option>
              </select>
            </div>
          </div>

          <div class="flex items-center justify-end gap-3 pt-2">
            <button
              type="button"
              id="cancelCreateProject"
              class="px-4 py-2.5 rounded-lg border border-gray-200 text-sm font-semibold text-gray-700 hover:bg-gray-50 transition-colors"
            >
              Cancel
            </button>
            <button
              type="submit"
              class="px-4 py-2.5 rounded-lg bg-blue-600 text-white text-sm font-semibold hover:bg-blue-700 transition-colors"
            >
              Create Project
            </button>
          </div>

    </div>

    <div
      id="addProjectTaskModal"
      class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50 p-4"
      aria-hidden="true"
    >
      <div
        id="addProjectTaskModalPanel"
        class="w-full max-w-xl bg-white rounded-2xl shadow-xl border border-gray-200"
      >
        <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100">
          <h3 id="addProjectTaskModalTitle" class="text-lg font-bold text-gray-900">Add Task</h3>
          <button
            id="closeAddProjectTaskModal"
            class="p-2 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-lg transition-colors"
            aria-label="Close add task modal"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-5 h-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>

        <form id="addProjectTaskForm" class="px-6 py-5 space-y-4">
          <input type="hidden" id="selectedProjectId" name="selectedProjectId" />

          <div>
            <label for="projectTaskTitle" class="text-sm font-medium text-gray-700">Task Title</label>
            <input
              id="projectTaskTitle"
              name="projectTaskTitle"
              type="text"
              required
              placeholder="Enter task title"
              class="mt-2 w-full px-3 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>

          <div>
            <label for="projectTaskDescription" class="text-sm font-medium text-gray-700">Description</label>
            <textarea
              id="projectTaskDescription"
              name="projectTaskDescription"
              rows="4"
              placeholder="Write task details"
              class="mt-2 w-full px-3 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"
            ></textarea>
          </div>

          <div>
            <label for="projectTaskDueDate" class="text-sm font-medium text-gray-700">Due Date</label>
            <input
              id="projectTaskDueDate"
              name="projectTaskDueDate"
              type="date"
              class="mt-2 w-full px-3 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>

          <div class="flex items-center justify-end gap-3 pt-2">
            <button
              type="button"
              id="cancelAddProjectTask"
              class="px-4 py-2.5 rounded-lg border border-gray-200 text-sm font-semibold text-gray-700 hover:bg-gray-50 transition-colors"
            >
              Cancel
            </button>
            <button
              type="submit"
              class="px-4 py-2.5 rounded-lg bg-blue-600 text-white text-sm font-semibold hover:bg-blue-700 transition-colors"
            >
              Add Task
            </button>
          </div>
        </form>
      </div>
    </div>

    <script type="module">
    import { BASE_URL } from "./js/config.js";

    const projectGrid = document.getElementById("project_grid");
    const projectSkeleton = document.getElementById("project_skeleton");

    function slugify(text) {
      return (text || "project")
        .toString()
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/(^-|-$)+/g, "");
    }

    function statusMeta(status) {
      if (status === "1") {
        return { label: "Active", badge: "text-green-700 bg-green-100" };
      }
      return { label: "On Hold", badge: "text-amber-700 bg-amber-100" };
    }

    function formatDate(dateStr) {
      const d = new Date(dateStr);
      if (Number.isNaN(d.getTime())) return "No date";
      return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
    }

    function setLoading(show) {
      if (projectSkeleton) projectSkeleton.classList.toggle("hidden", !show);
      if (projectGrid) projectGrid.classList.toggle("opacity-40", show);
    }

    function renderProjects(projects) {
      if (!projectGrid) return;

      if (!projects || projects.length === 0) {
        projectGrid.innerHTML = `<div class="col-span-3 bg-white border border-gray-100 rounded-2xl p-6 text-center text-gray-500">No projects found.</div>`;
        return;
      }

      const cards = projects.map((proj) => {
        const slug = slugify(proj.title);
        const { label, badge } = statusMeta(proj.status);
        const progress = Math.max(0, Math.min(100, Number(proj.project_progress) || 0));
        const createdText = formatDate(proj.created_at);
        const totalTasks = Math.max(0, Number(proj.total_task) || 0);

        return `
        <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6 hover:shadow-md transition-shadow" data-project-id="${slug}" data-project-name="${proj.title || "Project"}">
          <div class="flex items-start justify-between mb-4">
            <div class="flex h-11 w-11 items-center justify-center rounded-xl bg-blue-100">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z" />
              </svg>
            </div>
            <span class="text-xs font-semibold ${badge} px-2.5 py-1 rounded-full uppercase tracking-wide">${label}</span>
          </div>
          <h3 class="text-base font-bold text-gray-900">${proj.title || "Untitled project"}</h3>
          <p class="text-sm text-gray-500 mt-1.5 leading-relaxed">${proj.description || "No description"}</p>

          <div class="mt-5">
            <div class="flex items-center justify-between mb-2">
              <span class="text-xs font-medium text-gray-500">Progress</span>
              <span class="text-xs font-bold text-gray-700">${progress}%</span>
            </div>
            <div class="w-full bg-gray-100 rounded-full h-1.5">
              <div class="bg-blue-500 h-1.5 rounded-full" style="width: ${progress}%"></div>
            </div>
          </div>

          <div class="flex items-center justify-between mt-5 pt-4 border-t border-gray-100">
            <button type="button" class="openAddProjectTaskModal inline-flex items-center gap-2 text-xs font-semibold text-blue-600 hover:text-blue-700" data-project-id="${slug}" data-project-name="${proj.title || "Project"}">
              <span>Add Task</span>
              <span class="text-gray-400">•</span>
              <span class="text-gray-500"><span data-project-task-count data-base-count="${totalTasks}">${totalTasks}</span> tasks</span>
            </button>
            <div class="flex items-center gap-1.5 text-xs text-gray-400">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
              </svg>
              ${createdText}
            </div>
          </div>
        </div>`;
      });

      projectGrid.innerHTML = cards.join("");
    }

    function attachAddTaskHandlers() {
      const buttons = document.querySelectorAll(".openAddProjectTaskModal");
      buttons.forEach((btn) => {
        btn.addEventListener("click", () => {
          const pid = btn.getAttribute("data-project-id") || btn.getAttribute("data-project-name") || "project";
          const pname = btn.getAttribute("data-project-name") || "Project";
          showAddProjectTaskModal(pid, pname);
        });
      });
    }

    async function loadProjects() {
      const token = localStorage.getItem("token");
      if (!token) {
        window.location.href = "index.html";
        return;
      }

      setLoading(true);

      try {
        const res = await fetch(BASE_URL + "/project/", {
          headers: { Authorization: "Bearer " + token },
        });

        if (!res.ok) {
          console.error("Projects fetch failed", res.status);
          renderProjects([]);
          return;
        }

        const data = await res.json();
        const projects = Array.isArray(data.project) ? data.project : [];
        renderProjects(projects);
        attachAddTaskHandlers();
        updateProjectTaskCounters();
      } catch (err) {
        console.error("Unable to load projects", err);
        renderProjects([]);
      } finally {
        setLoading(false);
      }
    }

    document.addEventListener("DOMContentLoaded", loadProjects);
    </script>

    <script>
    const createProjectModal = document.getElementById("createProjectModal");
    const createProjectModalPanel = document.getElementById("createProjectModalPanel");
    const openCreateProjectModal = document.getElementById("openCreateProjectModal");
    const openCreateProjectModalCard = document.getElementById("openCreateProjectModalCard");
    const closeCreateProjectModal = document.getElementById("closeCreateProjectModal");
    const cancelCreateProject = document.getElementById("cancelCreateProject");
    const createProjectForm = document.getElementById("createProjectForm");
    const addProjectTaskModal = document.getElementById("addProjectTaskModal");
    const addProjectTaskModalPanel = document.getElementById("addProjectTaskModalPanel");
    const addProjectTaskModalTitle = document.getElementById("addProjectTaskModalTitle");
    const closeAddProjectTaskModal = document.getElementById("closeAddProjectTaskModal");
    const cancelAddProjectTask = document.getElementById("cancelAddProjectTask");
    const addProjectTaskForm = document.getElementById("addProjectTaskForm");
    const selectedProjectIdInput = document.getElementById("selectedProjectId");
    const projectTaskTitleInput = document.getElementById("projectTaskTitle");
    const projectTaskDueDateInput = document.getElementById("projectTaskDueDate");
    const projectTaskStorageKey = "projectTasksByProject";

    function showCreateProjectModal() {
      if (!createProjectModal) return;
      createProjectModal.classList.remove("hidden");
      createProjectModal.classList.add("flex");
      createProjectModal.setAttribute("aria-hidden", "false");
    }

    function hideCreateProjectModal() {
      if (!createProjectModal) return;
      createProjectModal.classList.add("hidden");
      createProjectModal.classList.remove("flex");
      createProjectModal.setAttribute("aria-hidden", "true");
    }

    function getStoredProjectTasks() {
      try {
        const raw = localStorage.getItem(projectTaskStorageKey);
        return raw ? JSON.parse(raw) : {};
      } catch (_error) {
        return {};
      }
    }

    function setStoredProjectTasks(data) {
      localStorage.setItem(projectTaskStorageKey, JSON.stringify(data));
    }

    function updateProjectTaskCounters() {
      const taskMap = getStoredProjectTasks();
      const projectCards = document.querySelectorAll("[data-project-id]");

      projectCards.forEach(function (card) {
        const projectId = card.getAttribute("data-project-id");
        const countElement = card.querySelector("[data-project-task-count]");
        if (!countElement || !projectId) return;
        const base = Number(countElement.getAttribute("data-base-count")) || 0;
        const count = Array.isArray(taskMap[projectId]) ? taskMap[projectId].length : base;
        countElement.textContent = String(count);
      });
    }

    function showAddProjectTaskModal(projectId, projectName) {
      if (!addProjectTaskModal || !selectedProjectIdInput) return;
      selectedProjectIdInput.value = projectId;
      if (addProjectTaskModalTitle) {
        addProjectTaskModalTitle.textContent = "Add Task to " + projectName;
      }
      addProjectTaskModal.classList.remove("hidden");
      addProjectTaskModal.classList.add("flex");
      addProjectTaskModal.setAttribute("aria-hidden", "false");
      if (projectTaskTitleInput) {
        projectTaskTitleInput.focus();
      }
    }

    function hideAddProjectTaskModal() {
      if (!addProjectTaskModal) return;
      addProjectTaskModal.classList.add("hidden");
      addProjectTaskModal.classList.remove("flex");
      addProjectTaskModal.setAttribute("aria-hidden", "true");
    }

    if (openCreateProjectModal) {
      openCreateProjectModal.addEventListener("click", showCreateProjectModal);
    }

    if (openCreateProjectModalCard) {
      openCreateProjectModalCard.addEventListener("click", showCreateProjectModal);
    }

    if (closeCreateProjectModal) {
      closeCreateProjectModal.addEventListener("click", hideCreateProjectModal);
    }

    if (cancelCreateProject) {
      cancelCreateProject.addEventListener("click", hideCreateProjectModal);
    }

    if (createProjectModal) {
      createProjectModal.addEventListener("click", function (event) {
        if (event.target === createProjectModal) {
          hideCreateProjectModal();
        }
      });
    }

    if (createProjectModalPanel) {
      createProjectModalPanel.addEventListener("click", function (event) {
        event.stopPropagation();
      });
    }

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") {
        hideCreateProjectModal();
      }
    });

    if (createProjectForm) {
      createProjectForm.addEventListener("submit", function (event) {
        event.preventDefault();
        createProjectForm.reset();
        hideCreateProjectModal();
      });
    }

    const openAddProjectTaskButtons = document.querySelectorAll(".openAddProjectTaskModal");
    openAddProjectTaskButtons.forEach(function (button) {
      button.addEventListener("click", function () {
        const projectCard = button.closest("[data-project-id]");
        if (!projectCard) return;
        const projectId = projectCard.getAttribute("data-project-id") || "";
        const projectName = projectCard.getAttribute("data-project-name") || "Project";
        showAddProjectTaskModal(projectId, projectName);
      });
    });

    if (closeAddProjectTaskModal) {
      closeAddProjectTaskModal.addEventListener("click", hideAddProjectTaskModal);
    }

    if (cancelAddProjectTask) {
      cancelAddProjectTask.addEventListener("click", hideAddProjectTaskModal);
    }

    if (addProjectTaskModal) {
      addProjectTaskModal.addEventListener("click", function (event) {
        if (event.target === addProjectTaskModal) {
          hideAddProjectTaskModal();
        }
      });
    }

    if (addProjectTaskModalPanel) {
      addProjectTaskModalPanel.addEventListener("click", function (event) {
        event.stopPropagation();
      });
    }

    if (addProjectTaskForm) {
      addProjectTaskForm.addEventListener("submit", function (event) {
        event.preventDefault();

        if (!selectedProjectIdInput) return;
        const projectId = selectedProjectIdInput.value;
        if (!projectId) return;

        const taskMap = getStoredProjectTasks();
        if (!Array.isArray(taskMap[projectId])) {
          taskMap[projectId] = [];
        }

        taskMap[projectId].push({
          title: projectTaskTitleInput ? projectTaskTitleInput.value.trim() : "",
          description: document.getElementById("projectTaskDescription")
            ? document.getElementById("projectTaskDescription").value.trim()
            : "",
          dueDate: projectTaskDueDateInput ? projectTaskDueDateInput.value : "",
          createdAt: new Date().toISOString(),
        });

        setStoredProjectTasks(taskMap);
        addProjectTaskForm.reset();
        updateProjectTaskCounters();
        hideAddProjectTaskModal();
      });
    }

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") {
        hideAddProjectTaskModal();
      }
    });

    updateProjectTaskCounters();
    </script>
  </body>
</html>
